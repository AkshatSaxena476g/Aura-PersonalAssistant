[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-assistant"
version = "0.1.0"
description = "AURA personal AI-powered desktop assistant"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7,<7",
    "google-genai>=1.0,<3",
    "pycaw==20240210",
    "pyttsx3>=2.9",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
aura = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
